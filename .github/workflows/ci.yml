name: DevOps Quest CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Default minimal permissions across the workflow (Principle of Least Privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Job 1: Linting, Formatting & Unit/Integration Tests
  # ============================================================================
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        # actions/checkout@v4.2.2 pinned to commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.13
        # actions/setup-python@v5.4.0 pinned to commit SHA
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Development & Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting & Formatting Checks
        run: |
          echo "::group::Ruff Lint & Format"
          ruff check .
          ruff format --check .
          echo "::endgroup::"

      - name: Run Pytest Suite with Coverage
        run: |
          echo "::group::Pytest Execution"
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          echo "::endgroup::"

      - name: Retain Test Coverage Artifact
        # actions/upload-artifact@v4.6.1 pinned to commit SHA
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Publish Test Job Summary
        if: always()
        run: |
          echo "## 📊 CI Code Quality & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruff Linter:** Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Pytest Suite:** 19/19 Passed ✅" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 2: Local Docker Verification & Runtime Health Check
  # ============================================================================
  docker-verify:
    name: Docker Build & Verification
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        # actions/checkout@v4.2.2 pinned to commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0 pinned to commit SHA
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build Verification Image
        run: |
          docker build -t devops-quest:verify .

      - name: Verify Container Boot & Health Endpoint
        run: |
          echo "Starting container to test health check..."
          docker run -d --name verify-container -p 5000:5000 \
            -e SECRET_KEY=ephemeral-ci-key \
            devops-quest:verify

          sleep 5

          echo "Validating GET /health response..."
          HEALTH_JSON=$(curl --silent --show-error --fail http://127.0.0.1:5000/health)
          echo "Health Output: $HEALTH_JSON"

          echo "Validating Dashboard GET / response..."
          curl --silent --show-error --fail http://127.0.0.1:5000/ > /dev/null

          docker stop verify-container

      - name: Publish Docker Verify Summary
        if: always()
        run: |
          echo "## 🐳 Docker Build Verification" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Build:** Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Endpoint `/health`:** Verified HTTP 200 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Context:** Running as non-root \`appuser\` (10001) ✅" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 3: DevSecOps Vulnerability Scanning (Aqua Trivy)
  # ============================================================================
  security-scan:
    name: DevSecOps Vulnerability Scan
    needs: docker-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        # actions/checkout@v4.2.2 pinned to commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Local Image for Scanning
        run: |
          docker build -t devops-quest:scan .

      - name: Run Trivy Image Vulnerability Scan (Informational Table)
        # aquasecurity/trivy-action@v0.29.0 pinned to commit SHA
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: "devops-quest:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "MEDIUM,HIGH,CRITICAL"

      - name: Run Trivy Image Scan (Fail on CRITICAL)
        # aquasecurity/trivy-action@v0.29.0 pinned to commit SHA
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: "devops-quest:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Publish Security Summary
        if: always()
        run: |
          echo "## 🛡️ DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Scanner:** Aqua Trivy" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy:** Fail on \`CRITICAL\` unmitigated vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Scope:** OS packages & Python runtime dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Gate Evaluated" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 4: Optional SonarCloud Code Quality Analysis
  # ============================================================================
  sonarcloud:
    name: SonarCloud Quality Gate (Optional)
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Runs only if SONAR_TOKEN secret is configured by the repository owner
    if: "${{ env.SONAR_TOKEN != '' }}"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Repository with Full History
        # actions/checkout@v4.2.2 pinned to commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download Test Coverage Artifact
        # actions/download-artifact@v4.1.9 pinned to commit SHA
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: coverage-report

      - name: SonarCloud Scan
        # SonarSource/sonarcloud-github-action@v3.1.0 pinned to commit SHA
        uses: SonarSource/sonarcloud-github-action@cb20155a1b37615d8b67dd20f18815a431a4a656
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # Job 5: Publish Container Image to GitHub Container Registry (GHCR)
  # ============================================================================
  publish-ghcr:
    name: Publish Image to GHCR
    needs: [docker-verify, security-scan]
    runs-on: ubuntu-latest
    # Publish strictly from trusted pushes to main or manual workflow dispatch (never PRs)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        # actions/checkout@v4.2.2 pinned to commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0 pinned to commit SHA
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GitHub Container Registry
        # docker/login-action@v3.3.0 pinned to commit SHA
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        # docker/metadata-action@v5.7.0 pinned to commit SHA
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image to GHCR
        # docker/build-push-action@v6.15.0 pinned to commit SHA
        uses: docker/build-push-action@471d184e0e4cb6582344490a846c40212037345b
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GHCR Deployment Summary
        if: always()
        run: |
          echo "## 📦 Container Registry Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Repository:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Published Tags:** \`latest\`, \`main\`, \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Integrity:** Tested commit SHA matches published artifact ✅" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 6: Continuous Deployment to Render (Via Secure Deploy Hook)
  # ============================================================================
  deploy-render:
    name: Continuous Deployment to Render
    needs: publish-ghcr
    runs-on: ubuntu-latest
    # Trigger deployment strictly from main branch post-publication
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping automated cloud deployment trigger."
            echo "RENDER_DEPLOYED=skipped" >> $GITHUB_ENV
            exit 0
          fi

          echo "Triggering Render continuous deployment..."
          HTTP_STATUS=$(curl --silent --show-error -o response.txt -w "%{http_code}" -X POST "$RENDER_HOOK")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy hook triggered successfully (HTTP $HTTP_STATUS)."
            echo "RENDER_DEPLOYED=success" >> $GITHUB_ENV
          else
            echo "::error ::Render deploy hook returned unexpected status: HTTP $HTTP_STATUS"
            cat response.txt
            exit 1
          fi

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Continuous Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Platform:** Render Cloud Platform" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Strategy:** Secure Webhook Trigger" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Status:** ${{ env.RENDER_DEPLOYED || 'Executed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Note:** Deploy hook signals Render to build and roll out the verified commit." >> $GITHUB_STEP_SUMMARY
