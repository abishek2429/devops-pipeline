# ==============================================================================
# DevOps Quest - Docker Compose Configuration
#
# Provides isolated local container execution with persistent database storage.
# Run with:
#   docker compose up --build -d
# View logs:
#   docker compose logs -f
# Stop:
#   docker compose down
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-quest:local
    container_name: devops-quest-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=local-dev-docker-compose-secret-key-replace-in-cloud
      - DATABASE_PATH=/app/instance/devops_quest.db
    volumes:
      # Explicit persistent storage for SQLite database
      - devops_quest_storage:/app/instance
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import os, sys, urllib.request; url = f'http://127.0.0.1:{os.environ.get('PORT', '5000')}/health'; res = urllib.request.urlopen(url, timeout=3); sys.exit(0 if res.getcode() == 200 else 1)\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Named volume ensuring challenges persist across container restarts and rebuilds
  devops_quest_storage:
    driver: local
