# ==============================================================================
# DevOps Quest - SonarCloud Configuration File
#
# Static Application Security Testing (SAST) and Code Quality Analysis
# This configuration is optional and does not block local execution.
# ==============================================================================

# Project Identification
# Replace 'your-organization' and 'your-project-key' with your actual SonarCloud IDs
sonar.projectKey=abishek2429_devops-pipeline
sonar.organization=abishek2429
sonar.projectName=DevOps Quest

# Source and Test File Paths
sonar.sources=app
sonar.tests=tests

# Encodings and Language Specifications
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Exclusions from Code Analysis
sonar.exclusions=**/__pycache__/**,**/static/**,**/instance/**

# Test Coverage Integration
sonar.python.coverage.reportPaths=coverage.xml
